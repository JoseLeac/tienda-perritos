name: CI/CD Tienda Perritos - Frontend

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"

jobs:
  build-push-deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login en Amazon ECR (runner)
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build imagen Frontend y push a ECR
        run: |
          cd frontend
          docker build -t tienda-frontend .
          docker tag tienda-frontend:latest ${{ secrets.ECR_REPO_URL_FRONTEND }}:latest
          docker push ${{ secrets.ECR_REPO_URL_FRONTEND }}:latest

      - name: Desplegar Frontend vía SSM
        run: |
          # 1. Obtenemos solo el dominio del registro (ej: 12345.dkr.ecr.us-east-1.amazonaws.com)
          # Esto evita errores si ECR_REGISTRY no está bien configurado
          REGISTRY_DOMAIN=$(echo "${{ secrets.ECR_REPO_URL_FRONTEND }}" | cut -d'/' -f1)

          # 2. Enviamos el comando y capturamos el ID para poder rastrearlo
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ secrets.EC2_FRONTEND_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --comment "Actualizar tienda-frontend desde ECR" \
            --parameters "{\"commands\":[
              \"set -e\",
              \"aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin $REGISTRY_DOMAIN\",
              \"docker pull ${{ secrets.ECR_REPO_URL_FRONTEND }}:latest\",
              \"docker stop tienda-frontend || true\",
              \"docker rm tienda-frontend || true\",
              \"docker run -d --name tienda-frontend -p 80:80 ${{ secrets.ECR_REPO_URL_FRONTEND }}:latest\",
              \"docker image prune -a -f\"
            ]}" \
            --query "Command.CommandId" --output text)

          echo "Comando enviado a SSM. ID: $COMMAND_ID"

          # 3. Forzamos a GitHub a esperar el resultado real de la EC2
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id ${{ secrets.EC2_FRONTEND_INSTANCE_ID }}

          echo "¡Despliegue completado con éxito en la EC2!"
