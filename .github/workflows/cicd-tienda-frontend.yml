name: CI/CD Tienda Perritos - Frontend

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"

jobs:
  build-push-deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      # ==========================================
      # CONFIGURACIÓN DE CREDENCIALES (AWS Y DOCKER)
      # ==========================================
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login en Amazon ECR (runner)
        uses: aws-actions/amazon-ecr-login@v1

      - name: Login en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ==========================================
      # CONSTRUCCIÓN Y DOBLE DISTRIBUCIÓN
      # ==========================================
      - name: Build imagen Frontend y push (ECR + Docker Hub)
        run: |
          cd frontend

          # 1. Construir la imagen base localmente en el runner
          docker build -t tienda-frontend .

          # 2. Etiquetar y subir a Amazon ECR (Tu entorno privado en AWS)
          docker tag tienda-frontend:latest ${{ secrets.ECR_REPO_URL_FRONTEND }}:latest
          docker push ${{ secrets.ECR_REPO_URL_FRONTEND }}:latest

          # 3. Etiquetar y subir a Docker Hub (Tu repositorio público leaduran/tienda-frontend)
          docker tag tienda-frontend:latest ${{ secrets.DOCKERHUB_USERNAME }}/tienda-frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/tienda-frontend:latest

      # ==========================================
      # DESPLIEGUE EN EL SERVIDOR (EC2)
      # ==========================================
      - name: Desplegar Frontend vía SSM
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_FRONTEND_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --comment "Actualizar tienda-frontend desde ECR" \
            --parameters '{"commands":[
              "set -e",
              "aws ecr get-login-password --region '${{ secrets.AWS_REGION }}' | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}",
              "docker pull ${{ secrets.ECR_REPO_URL_FRONTEND }}:latest",
              "docker stop tienda-frontend || true",
              "docker rm tienda-frontend || true",
              "docker run -d --name tienda-frontend -p 80:80 ${{ secrets.ECR_REPO_URL_FRONTEND }}:latest"
            ]}' \
            --output text
